<meta charset="utf-8">
<!--
  SPECTRAL SCOPE — live 1/f + PAF parameterization for OpenBCI Cyton (2ch)
  ------------------------------------------------------------------------
  Consumes the live Welch power spectrum from eeg_server.py over WebSocket.

  What it demonstrates:
   • PAF via naive raw-peak drifts when the 1/f slope changes (it doesn't
     move because alpha moved — it moves because the background tilted).
     Toggle to "1/f-removed" peak and it holds still. That's why FOOOF exists.
   • chi (aperiodic exponent) as its own readout; reward it flatter OR steeper
     and watch the reward flip sign — "1/f increase" has no fixed meaning.
   • EMG flattens the tail -> corrupts chi. In "reward flatter" mode, a clench
     literally becomes the reward. The hijack, one layer deeper.

  ===[ REAL DATA SEAM ]===  In production: Welch PSD on a 4–8 s window (fine
  freq resolution; PAF/chi are slow so slow updates are fine), then either full
  specparam every 1–2 s, or the cheap online proxy used here: OLS slope of
  log-power vs log-freq over a fit range that MASKS the oscillatory bands, plus
  parabolic-interpolated peak. Replace synthPSD() with your real freqs[]/power[].
-->
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1626; --ink:#dfe7f2; --dim:#6f7f9b; --faint:#3a4a68;
    --line:#1e2a42; --grid:#16203a; --warn:#ff6b5e; --good:#6fe3c4; --amber:#f2c14e;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  #wrap{position:relative;width:100%;min-height:600px;color:var(--ink);font-family:var(--sans);
    background:radial-gradient(120% 90% at 50% 20%,var(--bg2),var(--bg));border-radius:12px;padding:18px}
  .title{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .sub{font-family:var(--mono);font-size:12px;color:var(--good);margin-top:4px}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .readouts{display:flex;gap:20px;font-family:var(--mono);text-align:right}
  .readouts .k{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
  .readouts .v{font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}

  #plot{width:100%;height:340px;display:block;margin:14px 0 10px;border:1px solid var(--line);
    border-radius:10px;background:#0b1120}

  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
  button,.seg{font-family:var(--mono);font-size:12px;color:var(--ink);background:#131c30;
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s}
  button:hover,.seg:hover{background:#1a2540;border-color:#2c3d63}
  button:active{transform:translateY(1px)}
  button:focus-visible,.seg:focus-visible{outline:2px solid var(--good);outline-offset:2px}
  .seg.on{background:var(--good);color:#06231c;border-color:var(--good);font-weight:600}
  .grp{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#0e1526}
  .grp .seg{border:none;border-radius:0;border-right:1px solid var(--line)}
  .grp .seg:last-child{border-right:none}
  #emgBtn{border-color:#4a2b2b}
  #emgBtn.held{background:var(--warn);color:#2a0806;border-color:var(--warn)}
  .lbl{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-right:2px}

  .note{margin-top:12px;font-size:12px;line-height:1.55;color:var(--dim);max-width:640px}
  .note b{color:var(--ink)} .note .w{color:var(--warn)}
  .banner{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--warn);
    border:1px solid var(--warn);background:rgba(40,8,6,.5);padding:4px 10px;border-radius:999px;
    margin-left:10px;opacity:0;transition:opacity .2s}
  .banner.show{opacity:1}
  @media(max-width:600px){.readouts .v{font-size:16px}.readouts{gap:12px}}
</style>

<div id="wrap">
  <div class="top">
    <div>
      <div class="title">Spectral scope · 1/f + PAF</div>
      <div class="sub" id="sub">aperiodic fit + individual alpha peak · <span id="conn">connecting to live EEG…</span> <span class="banner" id="banner">EMG — tail corrupted</span></div>
    </div>
    <div class="readouts">
      <div><div class="k">PAF (Hz)</div><div class="v" id="rPaf" style="color:var(--amber)">10.0</div></div>
      <div><div class="k">&chi; exponent</div><div class="v" id="rChi">1.20</div></div>
      <div><div class="k">reward</div><div class="v" id="rRew" style="color:var(--good)">0.50</div></div>
    </div>
  </div>

  <canvas id="plot"></canvas>

  <div class="controls">
    <span class="lbl">PAF from</span>
    <div class="grp">
      <span class="seg" id="mRaw">raw peak</span>
      <span class="seg on" id="mFlat">1/f-removed</span>
    </div>
    <span class="lbl" style="margin-left:10px">reward</span>
    <div class="grp">
      <span class="seg on" id="rPafUp">PAF &uarr;</span>
      <span class="seg" id="rFlatter">flatter 1/f</span>
      <span class="seg" id="rSteeper">steeper 1/f</span>
    </div>
    <button id="calBtn" style="margin-left:10px">Calibrate baseline</button>
    <button id="emgBtn">Inject EMG</button>
  </div>

  <div class="note" id="noteBox"></div>
</div>

<script>
(() => {
  const cv = document.getElementById('plot'), ctx = cv.getContext('2d');
  let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
  function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  new ResizeObserver(resize).observe(cv); resize();
  const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;

  // frequency grid: fine (0.25 Hz) -> ~4 s window in reality
  const F=[]; for(let f=1; f<=45.0001; f+=0.25) F.push(+f.toFixed(2));
  const L10=Math.LN10, log10=x=>Math.log(x)/L10;
  const gauss=(f,mu,sd)=>Math.exp(-((f-mu)*(f-mu))/(2*sd*sd));

  let emgHeld=false;
  let lastLogP=null, liveEmg=0, reconnectTimer=null;

  function interpolateSpectrum(freqs, logpsd) {
    if (!Array.isArray(freqs) || !Array.isArray(logpsd) || freqs.length < 2 || freqs.length !== logpsd.length) {
      return null;
    }
    return F.map(f => {
      let i = freqs.findIndex(x => x >= f);
      if (i < 0) return logpsd[logpsd.length - 1];
      if (i === 0) return logpsd[0];
      const span = freqs[i] - freqs[i - 1];
      const t = span > 0 ? (f - freqs[i - 1]) / span : 0;
      return logpsd[i - 1] + t * (logpsd[i] - logpsd[i - 1]);
    });
  }

  function connectEEG() {
    const conn=document.getElementById('conn');
    conn.textContent='connecting to live EEG…';
    conn.style.color='var(--dim)';
    const ws=new WebSocket('ws://localhost:8765');
    ws.onopen=()=>{conn.textContent='● LIVE · Cyton+Daisy channels 2 + 7';conn.style.color='var(--good)';};
    ws.onmessage=e=>{
      const d=JSON.parse(e.data);
      const next=interpolateSpectrum(d.freqs,d.logpsd);
      if(next) lastLogP=next;
      liveEmg=Number.isFinite(d.emg)?d.emg:0;
    };
    ws.onerror=()=>ws.close();
    ws.onclose=()=>{
      conn.textContent='disconnected · retrying…';
      conn.style.color='var(--warn)';
      clearTimeout(reconnectTimer);
      reconnectTimer=setTimeout(connectEEG,1200);
    };
  }
  connectEEG();

  // ---- estimate chi (OLS slope, masking oscillatory bands) ----
  function fitAperiodic(logP){
    let sx=0,sy=0,sxx=0,sxy=0,n=0;
    for(let i=0;i<F.length;i++){
      const f=F[i];
      if(f<2) continue;                        // skip low-f bend
      if(f>=7&&f<=14) continue;                // mask alpha
      if(f>=16&&f<=30) continue;               // mask beta
      const x=log10(f), y=logP[i];
      sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; n++;
    }
    const slope=(n*sxy - sx*sy)/(n*sxx - sx*sx);
    const intercept=(sy - slope*sx)/n;
    return { slope, intercept, chi:-slope };
  }

  // ---- PAF: parabolic-interpolated peak in alpha window ----
  function findPAF(vals){ // vals = log power (raw) OR residual (1/f-removed)
    let lo=F.findIndex(f=>f>=7), hi=F.length-1;
    for(let i=lo;i<F.length;i++){ if(F[i]>14){hi=i-1;break;} }
    let k=lo, best=-Infinity;
    for(let i=lo;i<=hi;i++){ if(vals[i]>best){best=vals[i];k=i;} }
    if(k<=0||k>=F.length-1) return F[k];
    const ym1=vals[k-1], y0=vals[k], yp1=vals[k+1];
    const denom=(ym1-2*y0+yp1);
    const d = clamp(denom!==0 ? 0.5*(ym1-yp1)/denom : 0, -0.5, 0.5);
    return clamp(F[k] + d*0.25, 7, 14);   // 0.25 Hz bin spacing
  }

  // ---- state ----
  const st={ pafMethod:'flat', rewardMode:'pafUp',
             base:{paf:null,chi:null}, paf:10, chi:1.2, reward:0.5 };

  function step(dt){
    if(!lastLogP) return;
    const logP=lastLogP;
    const fit=fitAperiodic(logP);
    st.chi=fit.chi;
    const fittedLine = F.map(f=>fit.intercept + fit.slope*log10(f));
    const resid = logP.map((y,i)=>y-fittedLine[i]);
    st.paf = st.pafMethod==='raw' ? findPAF(logP) : findPAF(resid);

    // reward
    const b=st.base;
    let rew=0.5;
    if(st.rewardMode==='pafUp'  && b.paf!=null) rew=0.5+(st.paf-b.paf)*0.6;
    if(st.rewardMode==='flatter'&& b.chi!=null) rew=0.5+(b.chi-st.chi)*1.4; // chi down = flatter
    if(st.rewardMode==='steeper'&& b.chi!=null) rew=0.5+(st.chi-b.chi)*1.4;
    st.reward=clamp(rew);

    const emgHot=(emgHeld ? 0.7 : liveEmg)>0.25;
    document.getElementById('banner').classList.toggle('show',emgHot);

    draw(logP,fittedLine,resid);
    hud(emgHot);
  }

  // ---- drawing ----
  const padL=44,padR=14,padT=16,padB=26;
  function xf(f){ // log-frequency axis
    const a=log10(1),b=log10(45);
    return padL + (log10(f)-a)/(b-a)*(W-padL-padR);
  }
  let yMin=-3,yMax=3;
  function yf(v){ return padT + (yMax-v)/(yMax-yMin)*(H-padT-padB); }

  function draw(logP,fitted,resid){
    ctx.clearRect(0,0,W,H);
    // autoscale y a bit
    let mn=Infinity,mx=-Infinity;
    for(const v of logP){ if(v<mn)mn=v; if(v>mx)mx=v; }
    yMin=mn-0.4; yMax=mx+0.4;

    // grid + freq ticks
    ctx.strokeStyle='var(--grid)'; ctx.lineWidth=1; ctx.fillStyle='#556688';
    ctx.font='10px ui-monospace,monospace'; ctx.textAlign='center';
    [1,2,4,8,10,16,22,32,45].forEach(f=>{
      const x=xf(f);
      ctx.strokeStyle='rgba(30,42,66,.7)';
      ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,H-padB);ctx.stroke();
      ctx.fillStyle='#5f7290'; ctx.fillText(f, x, H-9);
    });

    // masked (fit-excluded) bands: alpha 7-14, beta 16-30 — faint hatch
    ctx.fillStyle='rgba(111,227,196,.06)';
    ctx.fillRect(xf(7),padT, xf(14)-xf(7), H-padT-padB);   // alpha window (kept for PAF)
    ctx.fillStyle='rgba(120,140,180,.045)';
    ctx.fillRect(xf(16),padT, xf(30)-xf(16), H-padT-padB); // beta (masked from fit)

    // fitted 1/f line (dashed amber) — drawn UNDER the peaks
    ctx.setLineDash([5,4]); ctx.strokeStyle='var(--amber)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    F.forEach((f,i)=>{ const x=xf(f),y=yf(fitted[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke(); ctx.setLineDash([]);

    // the PSD curve
    ctx.strokeStyle='var(--good)'; ctx.lineWidth=1.8; ctx.beginPath();
    F.forEach((f,i)=>{ const x=xf(f),y=yf(logP[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();

    // PAF marker: vertical drop-line + label
    const px=xf(st.paf);
    ctx.strokeStyle=st.pafMethod==='raw' ? 'rgba(242,193,78,.9)' : 'rgba(255,255,255,.85)';
    ctx.setLineDash([2,3]); ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(px,padT);ctx.lineTo(px,H-padB);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=st.pafMethod==='raw'?'var(--amber)':'#fff';
    ctx.textAlign='left'; ctx.font='11px ui-monospace,monospace';
    ctx.fillText('PAF '+st.paf.toFixed(1)+' Hz', Math.min(px+5,W-90), padT+12);

    // y label
    ctx.save(); ctx.translate(12,H/2); ctx.rotate(-Math.PI/2);
    ctx.fillStyle='#5f7290'; ctx.textAlign='center'; ctx.font='10px ui-monospace,monospace';
    ctx.fillText('log₁₀ power', 0,0); ctx.restore();
  }

  function hud(emgHot){
    document.getElementById('rPaf').textContent=st.paf.toFixed(1);
    const chiEl=document.getElementById('rChi');
    chiEl.textContent=st.chi.toFixed(2);
    chiEl.style.color = emgHot ? 'var(--warn)' : 'var(--ink)';
    document.getElementById('rRew').textContent=st.reward.toFixed(2);
    document.getElementById('rRew').style.color = st.reward>0.55?'var(--good)':st.reward<0.45?'var(--warn)':'var(--dim)';
  }

  // ---- notes that explain the CURRENT reward interpretation ----
  const notes={
    pafUp:`<b>Reward = PAF ↑.</b> Coherent target: higher individual alpha frequency tracks faster processing & better memory (Klimesch). PAF slows with fatigue, rises with arousal. This is the one direction with a stable meaning.`,
    flatter:`<b>Reward = flatter 1/f</b> (smaller χ). Reads as <b>more excitation / more awake</b> (E:I toward E) — but flattening is <span class="w">also the aging "neural noise" signature</span>. Same change, opposite valence depending on frame. And note: an EMG clench flattens the tail, so with a real electrode this mode literally rewards jaw tension.`,
    steeper:`<b>Reward = steeper 1/f</b> (larger χ). Reads as <b>more inhibition</b> (drowsiness, sleep, anesthesia all steepen it) — yet against the aging frame a steeper slope looks "cleaner/younger." There is no fixed answer to which way is "better."`
  };
  function setNote(){ document.getElementById('noteBox').innerHTML=notes[st.rewardMode]; }

  // ---- controls ----
  const on=(id,f)=>document.getElementById(id).addEventListener('click',f);
  const setSeg=(a,b,val,key)=>{document.getElementById(a).classList.toggle('on',val===key[0]);
                               document.getElementById(b).classList.toggle('on',val===key[1]);};
  on('mRaw', ()=>{st.pafMethod='raw';  m3('mRaw','mFlat',null,'raw');});
  on('mFlat',()=>{st.pafMethod='flat'; m3('mRaw','mFlat',null,'flat');});
  function m3(a,b,c,which){ [a,b,c].filter(Boolean).forEach(id=>document.getElementById(id).classList.remove('on'));
    if(which==='raw')document.getElementById('mRaw').classList.add('on');
    if(which==='flat')document.getElementById('mFlat').classList.add('on'); }

  function rewardSel(mode){ st.rewardMode=mode;
    ['rPafUp','rFlatter','rSteeper'].forEach(id=>document.getElementById(id).classList.remove('on'));
    document.getElementById(mode==='pafUp'?'rPafUp':mode==='flatter'?'rFlatter':'rSteeper').classList.add('on');
    setNote(); }
  on('rPafUp',()=>rewardSel('pafUp'));
  on('rFlatter',()=>rewardSel('flatter'));
  on('rSteeper',()=>rewardSel('steeper'));

  on('calBtn',()=>{ st.base.paf=st.paf; st.base.chi=st.chi;
    document.getElementById('calBtn').textContent='Recalibrate'; });

  const emgBtn=document.getElementById('emgBtn');
  const hold=v=>{emgHeld=v;emgBtn.classList.toggle('held',v);};
  emgBtn.addEventListener('pointerdown',()=>hold(true));
  emgBtn.addEventListener('pointerup',()=>hold(false));
  emgBtn.addEventListener('pointerleave',()=>hold(false));
  emgBtn.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hold(true);}});
  emgBtn.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')hold(false);});

  setNote();

  // ---- loop ----
  let last=performance.now();
  function frame(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
    step(dt); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
